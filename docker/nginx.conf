server {
    listen 8080;
    server_name _;
    root /app/public;

    index index.php;

    charset utf-8;

    # ---- En-têtes de sécurité (A-13) -------------------------------
    # `always` pour que l'en-tête soit présent aussi sur les réponses
    # d'erreur (4xx/5xx), sinon un attaquant peut exploiter l'absence
    # d'en-tête sur une réponse générée par erreur.
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-DNS-Prefetch-Control    "off" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # Le backend ne sert que du JSON et des fichiers statiques : le verrouiller
    # au niveau du serveur évite de dépendre du seul en-tête applicatif.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    # Les réponses de l'API ne doivent jamais être mises en cache par un
    # intermédiaire : elles sont spécifiques à l'utilisateur authentifié.
    add_header Cache-Control "no-store" always;

    # Taille maximale d'un corps de requête (A-42). L'API n'accepte que des
    # formulaires JSON et un avatar plafonné à 2 Mo ; 4 Mo laisse la marge.
    client_max_body_size 4m;

    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Saturation des logs : en production, on ne journalise pas chaque requête.
    access_log /var/log/nginx/access.log combined buffer=32k flush=5s;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Empêche l'exécution de scripts PHP déposés par erreur dans
        # l'arborescence (uploads, storage).
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_index index.php;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
